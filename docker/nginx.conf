# Конфигурация nginx для продакшена.
#
# nginx — единственная точка входа: отдаёт статику Vue,
# а запросы к API, админке и WebSocket передаёт в Django.

server {
    listen 80;
    server_name _;

    # Лимит на размер загружаемого файла.
    # Без него nginx обрежет загрузку картинки с ошибкой 413
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Служебный путь для проверки владения доменом.
    # Let's Encrypt кладёт сюда файл и читает его по http
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA: неизвестные пути отдаём index.html,
    # дальше маршрутизацией занимается Vue в браузере
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Реальный IP клиента — Django читает его для поля ip_address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Админка Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: требует отдельных заголовков для перехода
    # с обычного HTTP на постоянное соединение
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Соединение не должно рваться по таймауту при простое
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Загруженные пользователями файлы и статика админки.
    # nginx отдаёт их напрямую с диска — быстрее, чем через Django
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }
}